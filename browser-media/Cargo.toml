[package]
name = "browser-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Ergonomic browser media capture for Rust/WASM: getUserMedia, screen share, virtual backgrounds, microphone level and voice-activity monitoring, and MediaRecorder download."
license = "Apache-2.0"
repository = "https://github.com/cipansor/juncto"
homepage = "https://github.com/cipansor/juncto/tree/main/browser-media"
documentation = "https://docs.rs/browser-media"
readme = "README.md"
keywords = ["wasm", "getusermedia", "webcam", "microphone", "mediarecorder"]
categories = ["wasm", "multimedia", "web-programming"]
exclude = ["/.github"]

[package.metadata.docs.rs]
# Docs are most useful for the wasm target this crate is written for.
default-target = "wasm32-unknown-unknown"

[dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
send_wrapper = "0.6"
serde = { version = "1.0", features = ["derive"] }
web-sys = { version = "0.3.105", features = [
    "Window",
    "Navigator",
    "MediaDevices",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaStreamAudioSourceNode",
    "HtmlVideoElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "HtmlAnchorElement",
    "MediaRecorder",
    "MediaRecorderOptions",
    "Blob",
    "BlobEvent",
    "BlobPropertyBag",
    "AudioContext",
    "AnalyserNode",
    "AudioNode",
    "DynamicsCompressorNode",
    "AudioParam",
    "Url",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "RecordingState",
    "CustomEvent",
    "CustomEventInit",
    "MediaTrackSettings",
] }

[dev-dependencies]
serde_json = "1.0"
wasm-bindgen-test = "0.3.78"
