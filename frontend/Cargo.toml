[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = { version = "0.8.15" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", features = ["json"] }
shared = { path = "../shared" }
browser-media = { path = "../browser-media" }
gloo-net = "0.7.0"
wasm-bindgen = "0.2.128"
console_error_panic_hook = "0.1.7"
urlencoding = "2.1.3"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = ["WebSocket", "MessageEvent", "Location", "Window", "MouseEvent", "HtmlCanvasElement", "CanvasRenderingContext2d", "Navigator", "MediaDevices", "MediaDeviceInfo", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "HtmlVideoElement", "HtmlMediaElement", "Element", "MediaDeviceKind", "FileReader", "File", "FileList", "Blob", "HtmlInputElement", "Event", "EventTarget", "KeyboardEvent", "Document", "HtmlElement", "Node", "AudioContext", "AnalyserNode", "AudioNode", "MediaStreamAudioSourceNode", "Clipboard", "RtcPeerConnection", "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcIceCandidate", "RtcIceCandidateInit", "RtcPeerConnectionIceEvent", "RtcTrackEvent", "RtcRtpSender", "RtcSdpType", "RtcConfiguration", "RtcIceServer", "RtcOfferOptions", "RtcAnswerOptions", "RtcSignalingState", "MediaTrackSettings", "CustomEvent", "CustomEventInit", "DynamicsCompressorNode", "AudioParam", "Storage", "MediaRecorder", "MediaRecorderOptions", "BlobEvent", "BlobPropertyBag", "HtmlAnchorElement", "Url", "RecordingState", "DomRect"] }
send_wrapper = "0.6"
gloo-timers = "0.4.0"
wasm-bindgen-futures = "0.4.78"

[dev-dependencies]
# Native unit tests need a global async executor for Leptos `Effect::new`.
any_spawner = { version = "0.3", features = ["futures-executor"] }

[lib]
crate-type = ["cdylib", "rlib"]
